<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Admin · WhatsApp call · mobile</title>
<link rel="stylesheet" href="common.css">
<style>
body{width:390px;height:844px;overflow:hidden;position:relative;background:#0f2a1c;color:#fff;display:flex;flex-direction:column;align-items:center}
.ctop{width:100%;padding:16px;display:flex;justify-content:space-between;font-size:12.5px;color:#9fc0ab;font-weight:600}
.big{width:96px;height:96px;border-radius:50%;background:#1f4d36;display:grid;place-items:center;font-size:30px;font-weight:700;margin-top:36px;box-shadow:0 0 0 10px rgba(37,211,102,.18),0 0 0 22px rgba(37,211,102,.07)}
.nm{font-size:22px;font-weight:700;margin-top:22px}
.sub{font-size:13px;color:#9fc0ab;margin-top:4px}
.timer{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:14px}
.notes{width:calc(100% - 32px);margin-top:28px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;min-height:96px}
.notes .l{font-size:11px;color:#9fc0ab;font-weight:600;margin-bottom:4px}
.ctrls{position:absolute;bottom:42px;left:0;right:0;display:flex;justify-content:space-around}
.cb{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#cfe3d6}
.cb span{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.cb.end span{background:#d93a4a}
.caption{top:auto;bottom:6px;right:12px;color:#5f8a70}
</style></head><body>
<div class="ctop"><span>← Chat</span><span>● WhatsApp call</span></div>
<div class="big">CM</div>
<p class="nm">Claire Mbala</p>
<p class="sub">Homeowner · Mbala Residence</p>
<p class="timer">03:12</p>
<div class="notes"><p class="l">Call notes · saved to Claire's timeline</p>Wants to pay Part 4 by MoMo. Site visit Friday 10:00 with Bob.</div>
<div class="ctrls">
 <div class="cb"><span><svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg></span>Mute</div>
 <div class="cb"><span><svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>Speaker</div>
 <div class="cb end"><span><svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px;transform:rotate(135deg)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>End</div>
</div>
<p class="caption">Design concept · illustrative data</p>
</body></html>
